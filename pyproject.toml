[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[project]
name="sakurapay"
version="0.1.0"
description="SakuraPay - Payment Processing Reliability Simulator"
requires-python=">=3.12"
dependencies=["fastapi>=0.115","uvicorn[standard]>=0.30","sqlalchemy>=2.0","pydantic>=2.7","pydantic-settings>=2.3","PyJWT>=2.8","argon2-cffi>=23.1","httpx>=0.27","alembic>=1.13","psycopg[binary]>=3.1"]
[project.optional-dependencies]
dev=["pytest>=8.0","hypothesis>=6.100","ruff>=0.5","locust>=2.29","mypy>=1.10"]
[tool.hatch.build.targets.wheel]
packages=["app"]
[tool.ruff]
line-length=100

[tool.mypy]
python_version="3.12"
ignore_missing_imports=true
warn_unused_ignores=false
disable_error_code=["arg-type","attr-defined","valid-type","misc","assignment","return-value","union-attr","operator","index","call-arg","type-arg","no-any-return"]

[tool.ruff.lint]
# B008: FastAPI's Depends() in parameter defaults is the framework's idiom.
# BLE001: deliberate broad-catch at worker/transaction boundaries (logged, re-raised or recorded).
# B017: pytest.raises(Exception) used intentionally for ORM immutability checks.
ignore = ["B008", "BLE001", "B017"]
